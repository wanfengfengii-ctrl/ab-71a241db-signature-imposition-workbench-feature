services:
  api:
    build:
      context: ./api
    # 宿主端口可用 API_PORT 覆盖，默认 8000
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      - api
    # 宿主端口可用 WEB_PORT 覆盖，默认 8080
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # 一次性验收服务：
  #   docker compose up --build verify
  # 会自动拉起 web/api，跑完 pytest + Vitest + Playwright 后退出。
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    depends_on:
      - api
      - web
    environment:
      API_URL: http://api:8000
      BASE_URL: http://web
    command: ["/app/verify/run.sh"]
    profiles: ["verify"]
